<!DOCTYPE html>
<html>

<head>
    <title>Cyberpunk Hero Nexus</title>

    <style>
        /* Reset & Deep Dark Cyberpunk Background */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0e15;
            color: #e2e8f0;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        /* Vibrant Neon Header */
        h1 {
            color: #00f2fe;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            margin-bottom: 10px;
        }

        /* Subtext description */
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Glowing Action Button */
        button {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0d0e15;
            font-weight: bold;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
        }

        /* Card Flex Container */
        .card-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        /* Sleek Futuristic Cards */
        .hero-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4facfe;
            border-radius: 16px;
            width: 240px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .hero-card:hover {
            transform: translateY(-10px);
            border-color: #00f2fe;
        }

        /* Typography inside cards */
        .hero-name {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 12px 0;
        }

        .hero-power {
            color: #00f2fe;
            font-weight: 600;
            font-size: 15px;
            background: rgba(0, 242, 254, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 0 0 16px 0;
        }

        .hero-mission {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Cyberpunk Hero Nexus</h1>

    <p>
        Initialize the grid to compile superhero objects via JavaScript blueprints.
    </p>

    <button onclick="showHeroes()">Initialize Grid</button>

    <div class="card-container" id="heroCards"></div>

    <script>
        class Superhero {
            constructor(name, power, mission) {
                this.name = name;
                this.power = power;
                this.mission = mission;
            }

            // Updated template parsing clean semantics
            describeHero() {
                return "<div class='hero-card'>" +
                    "<p class='hero-name'>" + this.name + "</p>" +
                    "<p class='hero-power'>⚡ " + this.power + "</p>" +
                    "<p class='hero-mission'><strong>Mission:</strong> " + this.mission + "</p>" +
                    "</div>";
            }
        }

        function showHeroes() {
            let hero1 = new Superhero(
                "Captain Code",
                "Error Debugging",
                "Purge broken runtimes and stabilize the global stack."
            );

            let hero2 = new Superhero(
                "Pixel Flash",
                "Hyper-Speed Rendering",
                "Deploy high-fidelity interfaces in milliseconds."
            );

            let hero3 = new Superhero(
                "Logic Girl",
                "Algorithmic Thinking",
                "Solve hyper-complex network paradoxes cleanly."
            );

            let hero4 = new Superhero(
                "Data Knight",
                "Quantum Encryption",
                "Guard decentralized database matrices from perimeter breaches."
            );

            document.getElementById("heroCards").innerHTML =
                hero1.describeHero() +
                hero2.describeHero() +
                hero3.describeHero() +
                hero4.describeHero();
        }
    </script>

</body>

</html>
