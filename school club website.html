<!DOCTYPE html>
<html>

<head>
    <title>School Club Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #001235;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #fffefe;
        }

        .club-card {
            text-align: center;
            border: 2px solid #FF5A43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .club-card h3 {
            color: #FF5A43;
        }
    </style>
</head>

<body>

    <h1>My School Clubs</h1>

   
    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding Club</h3>
                    <p>I learn how to create websites, games, and simple apps.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Math Club</h3>
                    <p>I enjoy doing math equations and learning new ways to solve them.</p>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>sports Club</h3>
                    <p>I love doing activities and it also helps in our health.</p>
                </div>
            </div>

        </div>
    </div>

  
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

</body>

</html>
