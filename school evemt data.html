<!DOCTYPE html>
<html>

<head>
    <title>School Event Data Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #faf5ff;
            /* Light purple background */
            color: #2d3748;
            text-align: center;
        }

        .event-card {
            width: 520px;
            background-color: white;
            border: 3px solid #8b5cf6;
            /* Vibrant purple border */
            border-radius: 18px;
            margin: 40px auto;
            padding: 25px;
            box-shadow: 0 0 18px #ddd6fe;
            /* Soft purple shadow */
        }

        h1 {
            color: #6d28d9;
            /* Deep purple heading */
        }

        button {
            background-color: #7c3aed;
            /* Indigo/purple button */
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #5b21b6;
            /* Darker purple on hover */
        }

        .info-box {
            background-color: #f5f3ff;
            /* Pale purple box background */
            border: 2px dashed #a78bfa;
            /* Light purple dashed border */
            border-radius: 12px;
            margin-top: 18px;
            padding: 15px;
            text-align: left;
            line-height: 1.7;
        }

        #status {
            color: #0d9488;
            /* Teal color for success status */
            font-weight: bold;
            font-size: 18px;
        }

        #jsonOutput {
            color: #9d174d;
            /* Deep pink/magenta for raw JSON output */
            font-size: 14px;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <div class="event-card">

        <h1>School Event Data Viewer</h1>

        <p>
            Click the button to load school event details using JSON and asynchronous JavaScript.
        </p>

        <button onclick="showSchoolEvent()">Load Event Details</button>

        <div class="info-box">
            <h2>Loading Status</h2>
            <p id="status">Waiting to load event data...</p>
        </div>

        <div class="info-box">
            <h2>Event Details</h2>
            <p id="eventDetails"></p>
        </div>

        <div class="info-box">
            <h2>JSON Text Output</h2>
            <p id="jsonOutput"></p>
        </div>

    </div>

    <script>

        // Callback function
        function showLoadingMessage(message) {
            document.getElementById("status").innerHTML = message;
        }

        // Promise in JavaScript
        function fetchSchoolEventData(callback) {

            callback("Loading school event data... Please wait.");

            return new Promise(function (resolve) {

                // Asynchronous JavaScript using setTimeout()
                setTimeout(function () {

                    // JSON data (Kept exactly the same keys/structure, updated values)
                    let schoolEvent = {
                        eventName: "Annual Art & Design Exhibition",
                        date: "14 November 2026",
                        time: "11:00 AM",
                        venue: "Creative Arts Center",
                        coordinator: "Mr. Marcus",
                        participants: 85,
                        isRegistrationOpen: true
                    };

                    resolve(schoolEvent);

                }, 2000);
            });
        }

        // async/await in JavaScript
        async function showSchoolEvent() {

            let eventData = await fetchSchoolEventData(showLoadingMessage);

            document.getElementById("status").innerHTML = "Event data loaded successfully!";

            // JSON.stringify()
            let jsonText = JSON.stringify(eventData);

            // JSON.parse()
            let parsedEvent = JSON.parse(jsonText);

            // String concatenation to build the final display message
            let eventMessage = "";
            eventMessage = eventMessage + "Event Name: " + parsedEvent.eventName + "<br>";
            eventMessage = eventMessage + "Date: " + parsedEvent.date + "<br>";
            eventMessage = eventMessage + "Time: " + parsedEvent.time + "<br>";
            eventMessage = eventMessage + "Venue: " + parsedEvent.venue + "<br>";
            eventMessage = eventMessage + "Coordinator: " + parsedEvent.coordinator + "<br>";
            eventMessage = eventMessage + "Participants: " + parsedEvent.participants + "<br>";

            if (parsedEvent.isRegistrationOpen === true) {
                eventMessage = eventMessage + "Registration Status: Open";
            } else {
                eventMessage = eventMessage + "Registration Status: Closed";
            }

            document.getElementById("eventDetails").innerHTML = eventMessage;
            document.getElementById("jsonOutput").innerHTML = jsonText;
        }

    </script>

</body>

</html>
