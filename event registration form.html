<!DOCTYPE html>
<html>

<head>
    <title>Cyber Tech Summit 2026</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            text-align: center;
        }

        .form-card {
            width: 520px;
            background-color: #1e293b;
            border: 3px solid #06b6d4;
            border-radius: 18px;
            margin: 40px auto;
            padding: 25px;
            box-shadow: 0 0 25px #a855f7;
        }

        h1 {
            color: #38bdf8;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 12px;
            color: #94a3b8;
        }

        input,
        select {
            width: 95%;
            padding: 10px;
            margin-top: 6px;
            border: 2px solid #475569;
            border-radius: 8px;
            font-size: 15px;
            background-color: #0f172a;
            color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #06b6d4;
        }

        button {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 18px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #7e22ce;
        }

        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            line-height: 1.6;
            background-color: #334155;
        }

        .success {
            background-color: #064e3b !important;
            color: #34d399 !important;
            border: 2px solid #10b981;
        }

        .error {
            background-color: #7f1d1d !important;
            color: #f87171 !important;
            border: 2px solid #ef4444;
        }
    </style>
</head>

<body>

    <div class="form-card">

        <h1>Cyber Tech Summit</h1>

        <p>
            Secure your spot at the annual innovation summit and instantly generate your digital access key.
        </p>

        <form id="eventForm">

            <label for="studentName">Attendee Name</label>
            <input type="text" id="studentName" required minlength="3" placeholder="Enter your full name">

            <label for="email">Corporate Email</label>
            <input type="email" id="email" required placeholder="name@company.com">

            <label for="age">Experience (Years)</label>
            <input type="number" id="age" required min="8" max="18" placeholder="Years of experience (8 - 18)">

            <label for="eventName">Select Track</label>
            <select id="eventName" required>
                <option value="">Choose your specialization</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Cybersecurity Keynote">Cybersecurity Keynote</option>
                <option value="Cloud Architecture">Cloud Architecture</option>
                <option value="Web3 Development">Web3 Development</option>
            </select>

            <button type="button" onclick="registerEvent()">Claim Access Pass</button>

        </form>

        <div id="feedback">
            Awaiting your registration criteria...
        </div>

    </div>

    <script>
        function registerEvent() {

            let form = document.getElementById("eventForm");
            let feedback = document.getElementById("feedback");

            try {

                // Constraint Validation API
                if (!form.checkValidity()) {
                    throw form.reportValidity();
                }

                // Accessing Form Data
                let studentName = document.getElementById("studentName").value;
                let email = document.getElementById("email").value;
                let age = Number(document.getElementById("age").value);
                let eventName = document.getElementById("eventName").value;

                // Writing Validation Conditions
                if (studentName.length < 3) {
                    throw "Name must have at least 3 characters.";
                }

                if (age < 8 || age > 18) {
                    throw "Experience must be between 8 and 18 years.";
                }

                if (eventName === "") {
                    throw "Please select an event track.";
                }

                // DOM Feedback before timer
                feedback.className = "";
                feedback.innerHTML = "Verifying credentials and processing access key...";

                // Timers and Random Numbers
                setTimeout(function () {
                    let passNumber = Math.floor(Math.random() * 9000) + 1000;

                    feedback.className = "success";
                    feedback.innerHTML =
                        "Access Granted Successfully!<br>" +
                        "Attendee: " + studentName + "<br>" +
                        "Email: " + email + "<br>" +
                        "Experience: " + age + " Years<br>" +
                        "Track: " + eventName + "<br>" +
                        "Your Digital Pass ID: SUMMIT-" + passNumber;
                }, 2000);

            } catch (error) {

                // DOM Feedback for errors
                feedback.className = "error";

                if (error !== undefined) {
                    feedback.innerHTML = "Access Denied: " + error;
                } else {
                    feedback.innerHTML = "Please fix the form validation issues before submitting.";
                }
            }
        }
    </script>

</body>

</html>
